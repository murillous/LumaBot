<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Config do fontconfig embutido no Sharp, para o Windows (aponte FONTCONFIG_FILE para cá).
  O Pango pede emoji pela família genérica "emoji"; a config embutida não tem esse alias, então
  o emoji caía na Segoe UI Symbol, monocromática. Ver docs/sticker.md#emoji-colorido-no-windows.
-->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <!-- Fonte instalada só para o usuário (o padrão do "Instalar" do Windows) fica aqui. -->
  <dir>WINDOWSUSERFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
