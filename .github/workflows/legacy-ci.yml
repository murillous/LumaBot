name: Legacy CI

# Garante que o LumaBot em legacy/ segue verde durante a migração para o ZapForge.
# A suíte roda exatamente como está (sem alteração) — é a rede de segurança até a paridade.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: legacy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes do legacy
    runs-on: ubuntu-latest
    # Mesma base e fontes da imagem de produção (legacy/Dockerfile). O runner
    # ubuntu-latest traz Noto Color Emoji, que o libvips do sharp seleciona mas
    # não desenha — a legenda de emoji some e o teste do ImageProcessor falha.
    container: node:20-slim
    defaults:
      run:
        working-directory: legacy
    # Lembretes usam o fuso local; a suíte espera horário de Brasília.
    env:
      TZ: America/Sao_Paulo
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-core fonts-noto-cjk
        working-directory: /

      - uses: actions/checkout@v4

      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
