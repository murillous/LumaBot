name: CI

# App da Luma sobre o Bridger (workspace pnpm). O legacy/ tem o próprio workflow (legacy-ci.yml).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Os plugins de figurinha convertem vídeo e animação com o binário do FFmpeg, e os testes o
      # rodam.
      - name: FFmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      # O sticker-text desenha o emoji da legenda com a fonte colorida do sistema, e um teste
      # confere a cor.
      - name: Fonte de emoji colorido
        run: fc-list | grep -qi 'Noto Color Emoji' || (sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji)
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
