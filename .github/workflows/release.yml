name: Release

# Fluxo e segredos em docs/release.md; decisão no ADR 0082. Com changesets pendentes em `develop`,
# abre ou atualiza o PR de versão; depois do merge dele, sem changesets, publica no npm.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Sem cancel-in-progress: um publish nunca é cortado no meio. Pushes seguidos esperam a vez.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Trusted Publishing (OIDC) no npm, com provenance.
  id-token: write

jobs:
  release:
    name: Release
    # Fork ou branch errada no workflow_dispatch não publicam.
    if: github.repository == 'murillous/usebridger' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # O mesmo Postgres do ci.yml: o gate roda a suíte inteira.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRIDGER_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Gate no commit exato que vai virar PR de versão ou publish.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:packages

      # PR aberto com o GITHUB_TOKEN não dispara o ci.yml; com o token do App, o PR de versão
      # roda os checks como qualquer outro.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Só no primeiro publish de um pacote: o OIDC do npm não cria pacote novo. Sem o secret
      # (o normal, depois do bootstrap), o pnpm autentica pelo Trusted Publishing.
      - name: Token do npm (bootstrap)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"
          fi

      - uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # Nunca o `changeset version` direto: o script também sincroniza o CORE_VERSION.
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore(release): versão dos pacotes'
          pr-title: 'chore(release): versão dos pacotes'
          # Tags `@usebridger/<pacote>@<versão>` sim; o changelog fica no CHANGELOG.md de cada pacote.
          create-github-releases: false
        env:
          # O pnpm só lê config de env com o prefixo dele; NPM_CONFIG_PROVENANCE seria ignorado.
          PNPM_CONFIG_PROVENANCE: true
