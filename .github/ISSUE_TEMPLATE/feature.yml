name: Feature
description: Proponha uma funcionalidade para a Luma.
labels: [type:feature]
body:
  - type: markdown
    attributes:
      value: |
        Se a ideia pede mudança no kernel ou num plugin oficial (`@usebridger/*`), abra a issue no [usebridger](https://github.com/murillous/usebridger/issues).
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O que você quer fazer e hoje não consegue?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como a Luma se comportaria: comandos, mensagens, exemplos de conversa.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Outras formas de resolver e por que não servem.
