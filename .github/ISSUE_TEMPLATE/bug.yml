name: Bug
description: Algo não funciona como deveria.
labels: [type:bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Passos mínimos, com as mensagens enviadas ao bot quando for o caso.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Onde
      options:
        - legacy/ (produção)
        - apps/lumabot (sobre o Bridger)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Ambiente
      placeholder: Node 24.x, Linux, SQLite
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Stack trace ou trecho relevante do log (sem segredos).
      render: text
