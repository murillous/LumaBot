name: Bug
description: Algo não funciona como deveria.
labels: [type:bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Comportamento observado e o esperado.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Passos mínimos, de preferência com um trecho de código ou plugin de exemplo.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: packages
    attributes:
      label: Pacotes e versões
      placeholder: "@zapforge/core 0.3.1, @zapforge/transport-baileys 0.2.0"
  - type: input
    id: env
    attributes:
      label: Ambiente
      placeholder: Node 24.x, Linux, SQLite
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Stack trace ou trecho relevante do log (sem segredos).
      render: text
