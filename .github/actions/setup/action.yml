name: Setup
description: Node (versão do .nvmrc), pnpm (versão do packageManager) e dependências do workspace.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - run: pnpm install --frozen-lockfile
      shell: bash
